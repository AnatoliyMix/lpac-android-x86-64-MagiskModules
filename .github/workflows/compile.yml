name: Build Android Native lpac CLI (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenEUICC Source
        uses: actions/checkout@v4
        with:
          repository: estkme-group/openeuicc
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Configure and Compile lpac CLI
        run: |
          # Заходим в папку с нативным кодом lpac для Android
          cd lpac-jni/jni
          
          # Настраиваем Application.mk под архитектуру вашего ПК и статическую линковку runtime
          echo "APP_PLATFORM := android-29" > Application.mk
          echo "APP_ABI := x86_64" >> Application.mk
          echo "APP_STL := c++_static" >> Application.mk
          
          # Запускаем сборку консольной утилиты напрямую через ndk-build
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build -C .. APP_BUILD_SCRIPT=jni/Android.mk -j4

      - name: Upload Finished CLI Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-cli-android-x86_64
          path: lpac-jni/libs/x86_64/
          
