name: Build Android Native lpac CLI (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official lpac Source
        uses: actions/checkout@v4
        with:
          repository: estkme-group/lpac
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Compile via ndk-build
        run: |
          # Переходим в готовую Android-папку официального проекта lpac
          cd android/jni
          
          # Настраиваем конфигурацию жестко под архитектуру вашего ПК/планшета
          echo "APP_PLATFORM := android-29" > Application.mk
          echo "APP_ABI := x86_64" >> Application.mk
          echo "APP_STL := c++_static" >> Application.mk
          
          # Запускаем прямую сборку нативного CLI силами NDK
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build -j4

      - name: Upload Finished CLI Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-cli-android-x86_64
          path: android/libs/x86_64/
