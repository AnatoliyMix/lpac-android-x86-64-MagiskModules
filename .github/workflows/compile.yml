name: Build Android Native lpac CLI (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official lpac Source
        uses: actions/checkout@v4
        with:
          repository: estkme-group/lpac
          submodules: recursive
          path: lpac-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Hard Bypass CURL and PCSC Checks
        run: |
          cd lpac-src
          
          # УДАЛЯЕМ ПРОВЕРКУ CURL: принудительно заменяем вызов FindCURL на пустышку,
          # чтобы обойти ошибку "Required protocol HTTPS is not found"
          sed -i 's/find_package(CURL REQUIRED)/# find_package(CURL)/g' CMakeLists.txt
          
          # Полностью стираем десктопные требования PCSC из драйверов
          if [ -f driver/CMakeLists.txt ]; then
            sed -i 's/pkg_check_modules(PCSCLite REQUIRED libpcsclite)/# pkg_check_modules(PCSCLite libpcsclite)/g' driver/CMakeLists.txt
            sed -i 's/find_package(PCSCLite REQUIRED)/# find_package(PCSCLite)/g' driver/CMakeLists.txt
          fi

      - name: Configure CMake for Android x86_64
        run: |
          cd lpac-src
          mkdir build && cd build
          
          # Запускаем сборку консольного lpac через CMake под Android x86_64.
          # Принудительно отключаем десктопные PCSC/AT и переводим сеть на встроенный wulf.
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=x86_64 \
                -DANDROID_PLATFORM=android-29 \
                -DAPP_STL=c++_static \
                -DLPA_HTTP=wulf \
                -DLPA_WITH_APDU_MBIM=ON \
                -DLPA_WITH_APDU_PCSC=OFF \
                -DLPA_WITH_APDU_AT=OFF \
                ..

      - name: Compile lpac
        run: |
          cd lpac-src/build
          make -j4

      - name: Upload Finished CLI Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-cli-android-x86_64
          path: lpac-src/build/lpac
