name: Build lpac x86_64 MBIM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official lpac Source
        uses: actions/checkout@v4
        with:
          repository: estkme-group/lpac
          submodules: recursive
          path: lpac-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Hard-Cuts PCSC and Force MBIM Backend
        run: |
          cd lpac-src
          
          # Полностью переписываем driver/CMakeLists.txt, оставляя ТОЛЬКО MBIM драйвер
          cat << 'EOF' > driver/CMakeLists.txt
          set(DRIVER_SOURCES
              apdu.c
          )
          
          if(LPA_WITH_APDU_MBIM)
              list(APPEND DRIVER_SOURCES mbim.c)
              add_compile_definitions(LPA_WITH_APDU_MBIM)
          endif()
          
          add_library(driver STATIC ${DRIVER_SOURCES})
          EOF
          
          # Создаем чистую папку для сборки
          mkdir build

      - name: Configure CMake for Android x86_64
        run: |
          cd lpac-src/build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=x86_64 \
                -DANDROID_PLATFORM=android-29 \
                -DAPP_STL=c++_static \
                -DLPA_HTTP=curl \
                -DLPA_WITH_APDU_MBIM=ON \
                -DLPA_WITH_APDU_PCSC=OFF \
                -DLPA_WITH_APDU_AT=OFF \
                ..

      - name: Compile lpac
        run: |
          cd lpac-src/build
          make -j4

      - name: Upload Finished Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-android-x86_64-mbim
          path: lpac-src/build/lpac
          
