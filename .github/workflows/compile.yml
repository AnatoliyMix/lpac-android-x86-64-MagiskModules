name: Build Android Native lpac CLI (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenEUICC Source
        uses: actions/checkout@v4
        with:
          repository: estkme-group/openeuicc
          submodules: recursive

      - name: Find and Compile lpac CLI
        run: |
          # Выводим структуру, чтобы понять, где лежат исходники lpac
          echo "=== Проверяем структуру папок репозитория ==="
          ls -R | grep -E "lpac|jni|Android.mk" || true
          
          # Автоматический поиск папки, где лежит Android.mk для lpac
          TARGET_DIR=$(find . -type f -name "Android.mk" -not -path "*/build/*" | head -n 1 | xargs dirname)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "Ошибка: Файл Android.mk не найден в репозитории!"
            exit 1
          fi
          
          echo "Найдена папка с исходниками: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Если рядом нет jni/, создаем её или генерируем Application.mk прямо тут
          mkdir -p jni
          echo "APP_PLATFORM := android-29" > jni/Application.mk
          echo "APP_ABI := x86_64" >> jni/Application.mk
          echo "APP_STL := c++_static" >> jni/Application.mk
          
          # Запускаем сборку
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk -j4 || ndk-build -j4

      - name: Upload Finished CLI Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-cli-android-x86_64
          path: "**/libs/x86_64/*"
