name: Build Android Native lpac CLI (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android-Optimized lpac Fork
        uses: actions/checkout@v4
        with:
          repository: we-mobi/lpac
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Compile Native CLI with ndk-build
        run: |
          mkdir -p jni
          echo "APP_PLATFORM := android-29" > jni/Application.mk
          echo "APP_ABI := x86_64" >> jni/Application.mk
          echo "APP_STL := c++_static" >> jni/Application.mk
          
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build -C . -j4

      - name: Upload Finished CLI Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-cli-android-x86_64
          path: libs/x86_64/lpac
