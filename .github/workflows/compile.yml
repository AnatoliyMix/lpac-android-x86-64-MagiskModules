name: Build lpac x86_64 MBIM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official lpac Source
        uses: actions/checkout@v4
        with:
          repository: estkme-group/lpac
          submodules: recursive
          path: lpac-src

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Bypass All Dependency Checks
        run: |
          cd lpac-src
          
          # Отключаем принудительный поиск пакета pcsc в файле конфигурации драйверов
          if [ -f driver/CMakeLists.txt ]; then
            sed -i 's/pkg_check_modules(PCSCLite REQUIRED libpcsclite)/# pkg_check_modules(PCSCLite libpcsclite)/g' driver/CMakeLists.txt
            sed -i 's/find_package(PCSCLite REQUIRED)/# find_package(PCSCLite)/g' driver/CMakeLists.txt
            
            # ВЫРЕЗАЕМ СБОРКУ PCSC-ДРАЙВЕРА: заменяем команду добавления pcsc-библиотеки на комментарий
            sed -i 's/add_library(driver_apdu_pcsc/# add_library(driver_apdu_pcsc/g' driver/CMakeLists.txt
            sed -i 's/target_sources(driver_apdu_pcsc/# target_sources(driver_apdu_pcsc/g' driver/CMakeLists.txt
            sed -i 's/target_link_libraries(driver_apdu_pcsc/# target_link_libraries(driver_apdu_pcsc/g' driver/CMakeLists.txt
          fi
          
          # ОБМАНЫВАЕМ CMAKE (CURL ФЕЙК)
          mkdir -p cmake
          cat << 'EOF' > cmake/FindCURL.cmake
          set(CURL_FOUND TRUE)
          set(CURL_VERSION "8.0.0")
          add_library(CURL::libcurl INTERFACE IMPORTED)
          EOF
          
          # Добавляем нашу папку с фейковым CURL в приоритет поиска CMake
          echo "list(INSERT CMAKE_MODULE_PATH 0 \${CMAKE_CURRENT_SOURCE_DIR}/cmake)" > cmake_tmp.txt
          cat CMakeLists.txt >> cmake_tmp.txt
          mv cmake_tmp.txt CMakeLists.txt

      - name: Configure CMake for Android x86_64
        run: |
          cd lpac-src
          mkdir build && cd build
          
          # Запускаем конфигурацию
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=x86_64 \
                -DANDROID_PLATFORM=android-29 \
                ..

      - name: Compile lpac
        run: |
          cd lpac-src/build
          make -j4

      - name: Upload Finished Binary
        uses: actions/upload-artifact@v4
        with:
          name: lpac-android-x86_64-mbim
          path: lpac-src/build/lpac
          
